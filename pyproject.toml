[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fit-file-mapper"
version = "0.1.0"
description = "A Python application for mapping FIT file GPS data on USGS maps with advanced visualization capabilities"
readme = "readme.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Francis Rodrigues", email = "nocontact@example.com"},
]
keywords = [
    "fit-files",
    "gps",
    "mapping",
    "visualization",
    "usgs",
    "geospatial",
    "workout-analysis"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]

# Core dependencies
dependencies = [
    # Core FIT file parsing
    "fitparse>=1.2.0",
    
    # Database - DuckDB for analytical workloads
    "duckdb>=0.9.0",
    "sqlalchemy>=2.0.0",
    
    # Microservices framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "aiohttp>=3.8.0",
    "python-multipart>=0.0.6",
    
    # Geospatial and mapping libraries
    "folium>=0.14.0",
    "geopandas>=0.13.0",
    "shapely>=2.0.0",
    "pyproj>=3.4.0",
    "geopy>=2.3.0",
    
    # Data manipulation and analysis
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    
    # Visualization libraries
    "matplotlib>=3.7.0",
    "plotly>=5.14.0",
    "seaborn>=0.12.0",
    
    # Image processing for map stitching
    "pillow>=9.5.0",
    "opencv-python>=4.7.0",
    "scikit-image>=0.20.0",
    
    # HTTP requests and utilities
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "tqdm>=4.65.0",
    
    # Timezone handling
    "pytz>=2023.3",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.3.0",
    "ruff>=0.1.0",
    "mypy>=1.3.0",
    "pre-commit>=3.5.0",
]

# Advanced geospatial features
advanced = [
    "elevation>=1.1.0",
    "rasterio>=1.3.0",
    "cartopy>=0.21.0",
    "contextily>=1.3.0",
]

# Interactive web features
web = [
    "dash>=2.10.0",
    "streamlit>=1.25.0",
]

# All optional dependencies
all = [
    "fit-file-mapper[dev,advanced,web]",
]

[project.scripts]
fit-mapper = "src.cli:main"
fit-parser-service = "services.fit_parser.main:main"
map-service = "services.map_service.main:main"
visualization-service = "services.visualization.main:main"
api-gateway = "services.api_gateway.main:main"

[project.urls]
Homepage = "https://github.com/yourusername/fit-file-mapper"
Repository = "https://github.com/yourusername/fit-file-mapper"
Documentation = "https://github.com/yourusername/fit-file-mapper/docs"
"Bug Tracker" = "https://github.com/yourusername/fit-file-mapper/issues"

[tool.hatch.build.targets.wheel]
packages = ["src", "shared", "services"]

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py313"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "fitparse.*",
    "cv2.*",
    "folium.*",
    "plotly.*",
    "elevation.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src",
    "--cov=shared",
    "--cov=services",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src", "shared", "services"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
