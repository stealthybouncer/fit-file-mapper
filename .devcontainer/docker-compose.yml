services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ../..:/workspaces:cached
      - fit-data:/workspace/data
      - duckdb-data:/workspace/database
    command: sleep infinity
    environment:
      - PYTHONPATH=/workspace
      - DUCKDB_PATH=/workspace/database/workouts.duckdb
    networks:
      - fit-mapper-network

  fit-parser-service:
    build:
      context: ..
      dockerfile: services/fit-parser/Dockerfile.optimized
    volumes:
      - ../data/fit_files:/app/data/fit_files:ro
      - duckdb-data:/app/database
    environment:
      - DUCKDB_PATH=/app/database/workouts.duckdb
      - SERVICE_NAME=fit-parser
    networks:
      - fit-mapper-network
    ports:
      - "8001:8000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  map-service:
    build:
      context: ..
      dockerfile: services/map-service/Dockerfile.optimized
    volumes:
      - ../data/maps:/app/data/maps
      - duckdb-data:/app/database
    environment:
      - DUCKDB_PATH=/app/database/workouts.duckdb
      - SERVICE_NAME=map-service
    networks:
      - fit-mapper-network
    ports:
      - "8002:8000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  visualization-service:
    build:
      context: ..
      dockerfile: services/visualization/Dockerfile.optimized
    volumes:
      - ../output:/app/output
      - ../data/maps:/app/data/maps:ro
      - duckdb-data:/app/database
    environment:
      - DUCKDB_PATH=/app/database/workouts.duckdb
      - SERVICE_NAME=visualization
    networks:
      - fit-mapper-network
    ports:
      - "8003:8000"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile.optimized
    volumes:
      - duckdb-data:/app/database
    environment:
      - DUCKDB_PATH=/app/database/workouts.duckdb
      - FIT_PARSER_URL=http://fit-parser-service:8000
      - MAP_SERVICE_URL=http://map-service:8000
      - VISUALIZATION_URL=http://visualization-service:8000
    networks:
      - fit-mapper-network
    ports:
      - "8000:8000"
    depends_on:
      - fit-parser-service
      - map-service
      - visualization-service
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

volumes:
  fit-data:
  duckdb-data:

networks:
  fit-mapper-network:
    driver: bridge
